<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#2477d4"><title>魚丸追追樂｜現場競賽看板</title><link rel="icon" href="race/assets/fbicon.png"><link rel="stylesheet" href="race/race.css"><link rel="stylesheet" href="race/board-ranking.css"></head>

<body class="board-page display-only state-ready">
<div class="sky-decor" aria-hidden="true"><span class="pixel-cloud cloud-one"></span><span class="pixel-cloud cloud-two"></span><span class="sky-coin">★</span></div>
<header class="site-header"><a class="brand" href="fishball-race-board.html"><img src="race/assets/fbicon.png" alt="">魚丸追追樂 <span>現場競賽看板</span></a><div class="header-actions"><span id="connection" class="connection" role="status">連線中…</span><button id="sound-btn" class="ghost" type="button" aria-pressed="true">🔊 聲音開</button><button id="fullscreen-btn" class="ghost" type="button">全螢幕</button></div></header>
<main class="board-shell">
<p id="race-status" class="board-status" role="status">正在取得競賽資訊</p>
<p id="notice" class="notice" role="status" aria-live="polite"></p>
<section class="board-layout"><div class="panel ranking-panel"><div class="panel-heading"><div><h2>🏆 英雄排行榜 <small>TOP 10</small></h2><span id="live-badge">挑戰者募集中</span></div><div class="big-clock"><span class="timer-label">本場剩餘時間</span><strong id="clock">--:--</strong><div class="timer-track"><i id="timer-fill"></i></div><span id="freeze-label">等待主持人開始</span></div></div>
<div class="podium" aria-label="目前前三名">
<div id="podium-2" class="podium-card podium-silver"><span class="podium-rank"><b>02</b> 第二名</span><strong class="podium-name">虛位以待</strong><span class="podium-id">等待挑戰者</span><div class="podium-score"><span>—</span><small>分</small></div></div>
<div id="champion-banner" class="champion-banner is-empty"><span class="champion-crown" aria-hidden="true">👑</span><div><span id="champion-label" class="eyebrow">領先寶座</span><strong id="champion-name">虛位以待</strong><span id="champion-id"></span></div><div class="champion-points"><strong id="champion-score">—</strong><span id="champion-unit">分</span></div></div>
<div id="podium-3" class="podium-card podium-bronze"><span class="podium-rank"><b>03</b> 第三名</span><strong class="podium-name">虛位以待</strong><span class="podium-id">等待挑戰者</span><div class="podium-score"><span>—</span><small>分</small></div></div>
</div>
<div id="rank-update" class="race-update" role="status" aria-live="polite"><span>賽況快報</span><strong id="rank-update-text">每關完成更新成績，準備爭奪領先寶座！</strong></div>
<table aria-label="前十名即時排名"><thead><tr><th scope="col">名次</th><th scope="col">挑戰者</th><th scope="col" class="rank-movement">名次變動</th><th scope="col" class="rank-state">最近紀錄</th><th scope="col" class="align-right">最高分數</th></tr></thead><tbody id="rankings"></tbody></table>
<div id="empty-state" class="empty-state"><div class="empty-hero"><img src="race/assets/fbbg.png" alt="魚丸追追樂：勇闖海洋冒險"></div><strong>挑戰者，集合！</strong><p>輸入名字，讓全場看見你的實力。</p><div class="ready-blocks" aria-hidden="true"><span>3</span><span>2</span><span>1</span><b>GO!</b></div><span class="empty-hint">主持人按下開始，就能加入爭奪魚丸王！</span></div>
<div class="ranking-foot"><span>★ 吃好魚 · 衝高分 · 守護海洋 ★</span><small>同分依玩家識別碼排序 · 截止後固定成績</small><a id="play-link" href="fishball-race.html">玩家入口 ↗</a></div></div>
</section></main>
<div id="hype-banner" class="hype-banner" aria-hidden="true"><strong></strong><span></span></div><div id="celebration" class="celebration" aria-hidden="true"></div><div class="brick-ground" aria-hidden="true"></div>
<script type="module" src="race/board.mjs"></script></body></html>
